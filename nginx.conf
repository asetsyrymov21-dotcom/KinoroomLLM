server {
    listen 80;
    server_name roompilot.kz www.roompilot.kz admin.roompilot.kz app.roompilot.kz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name roompilot.kz www.roompilot.kz admin.roompilot.kz;

    ssl_certificate /etc/letsencrypt/live/roompilot.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roompilot.kz/privkey.pem;

    location ~ (^|/)\. {
        return 404;
    }

    location = / {
        return 302 /admin/;
    }

    # Operator admin panel
    location = /operator.html {
        root /usr/share/nginx/html;
        add_header Content-Type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /operator {
        return 301 /operator.html;
    }

    # Setup page
    location = /setup.html {
        root /usr/share/nginx/html;
        add_header Content-Type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Admin panel (React SPA)
    location /admin {
        alias /usr/share/nginx/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name app.roompilot.kz;

    ssl_certificate /etc/letsencrypt/live/roompilot.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roompilot.kz/privkey.pem;

    location ~ (^|/)\. {
        return 404;
    }

    # Telegram Mini App
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
